---
# Eclipse Temurin JDK major versions to install (from the Adoptium RPM repo).
# Override in your config.yml, e.g. `java_versions: [17, 21]`.
java_versions:
  - 8
  - 11
  - 17
  - 21
  - 25

# JDK selected by default in new shells (must be listed in java_versions).
java_default_version: 21

# Gradle isn't packaged in Fedora; installed from services.gradle.org as a
# fallback for projects that don't ship ./gradlew.
java_gradle_version: "8.14.3"
