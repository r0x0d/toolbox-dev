---
- name: Install pyenv build dependencies
  ansible.builtin.dnf:
    name:
      - patch
      - zlib-devel
      - bzip2
      - bzip2-devel
      - readline-devel
      - sqlite
      - sqlite-devel
      - tk-devel
      - libffi-devel
      - xz-devel
      - libuuid-devel
      - gdbm-libs
      - libnsl2
    state: present
  when: languages.python_development | default(false) | bool

- name: Install Python development packages
  ansible.builtin.dnf:
    name:
      - python3-devel
      - python3-pip
      - yamllint
      - ruff
      - pre-commit
      - uv
    state: present
  when: languages.python_development | default(false) | bool

- name: Install pyright
  ansible.builtin.pip:
    name: pyright==1.1.407
    state: present
  when: languages.python_development | default(false) | bool

- name: Install Python project tooling
  ansible.builtin.dnf:
    name:
      - pipx
      - poetry
      - tox
      - python3-virtualenv
    state: present
  when: languages.python_development | default(false) | bool

- name: Install additional Python interpreters
  ansible.builtin.dnf:
    name: "{{ python_extra_versions | map('regex_replace', '^(.*)$', 'python\\1') | list
             + python_extra_versions | map('regex_replace', '^(.*)$', 'python\\1-devel') | list }}"
    state: present
  when:
    - languages.python_development | default(false) | bool
    - python_extra_versions | length > 0
